<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pravidla přírodního barvení</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barvení">
<meta name="theme-color" content="#2f3f8f">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f6f7f4;--surface:#fff;--fg:#1d2420;--muted:#5d6862;--line:#d9ded8;--accent:#2f3f8f;--err:#a4432a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--surface:#1c2320;--fg:#e7ebe8;--muted:#9aa6a0;--line:#2f3934;--accent:#9fb0ff;--err:#f0957a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
img{width:64px;height:64px;border-radius:14px;align-self:center}
h1{margin:0;font-size:20px;text-align:center;font-weight:600}
p{margin:0;color:var(--muted);font-size:14px;text-align:center}
label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=password]{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
.rem{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--fg);font-weight:400}
.rem input{width:20px;height:20px;accent-color:var(--accent)}
button{font-size:17px;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--err);font-size:14px;text-align:center;min-height:1em}
</style>
</head>
<body>
<form id="f" hidden autocomplete="on">
  <img src="apple-touch-icon.png" alt="">
  <h1>Pravidla přírodního barvení</h1>
  <p>Zadej heslo kadeřnictví</p>
  <div><label for="pw">Heslo</label>
  <input type="password" id="pw" name="password" autocomplete="current-password" required></div>
  <label class="rem"><input type="checkbox" id="rem" checked> Zapamatovat toto zařízení</label>
  <button type="submit" id="go">Přihlásit</button>
  <div id="err" role="alert"></div>
</form>

function ub(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function bu(a){var s='';a=new Uint8Array(a);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function show(html){document.open();document.write(html);document.close()}
async function decryptWith(raw){
  var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);

}
async function derive(pw){

}
